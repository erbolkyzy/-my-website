<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Grammar Quest — Русская грамматика</title>
<style>
:root{
  --bg:#f8f6f2;--card:#fffdf9;--text:#30343b;--muted:#7d8188;
  --lav:#dcd5f2;--lav2:#eeeafa;--mint:#d8eee6;--peach:#f5ddd1;
  --blue:#d9e8f4;--yellow:#f5edc9;--pink:#efdce8;--line:#e8e3dc;
  --accent:#8b7db6;--accent-dark:#685a94;--shadow:0 12px 35px rgba(71,65,84,.08);
  --radius:22px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.page{min-height:100vh}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#f8f6f2,#f0edf7 55%,#eef7f3)}
.auth-card{width:min(470px,94vw);background:rgba(255,253,249,.94);border:1px solid #fff;border-radius:30px;padding:34px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}
.logo-icon{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:var(--lav);font-size:23px}
.auth-card h1{font-size:32px;margin:28px 0 8px;letter-spacing:-1px}
.auth-card p{color:var(--muted);line-height:1.55}
.tabs{display:flex;background:var(--lav2);padding:5px;border-radius:14px;margin:24px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted)}
.tabs button.active{background:white;color:var(--accent-dark);box-shadow:0 2px 8px rgba(0,0,0,.05);font-weight:700}
.field{margin:13px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:white;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.primary{width:100%;padding:14px 18px;background:var(--accent);color:white;border-radius:14px;font-weight:800;margin-top:8px}
.primary:hover{background:var(--accent-dark)}
.demo-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.error{color:#b45f68;font-size:13px;margin-top:8px}

.app{display:flex;min-height:100vh}
.sidebar{width:265px;background:#fffdf9;border-right:1px solid var(--line);padding:22px 15px;position:fixed;top:0;bottom:0;overflow:auto}
.sidebar .logo{padding:0 10px 25px}
.userbox{background:var(--lav2);border-radius:18px;padding:14px;margin:0 5px 17px}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--lav);display:grid;place-items:center;font-weight:800}
.user-row{display:flex;align-items:center;gap:10px}
.userbox small{color:var(--muted)}
.nav-title{font-size:11px;text-transform:uppercase;color:#a09ca5;font-weight:800;padding:13px 12px 6px;letter-spacing:.08em}
.nav button{width:100%;text-align:left;padding:11px 12px;background:transparent;border-radius:12px;color:#686b72;margin:2px 0}
.nav button:hover,.nav button.active{background:var(--lav2);color:var(--accent-dark);font-weight:700}
.logout{margin-top:15px;width:100%;padding:10px;border-radius:12px;background:#f8eded;color:#a25e67}
.main{margin-left:265px;width:calc(100% - 265px);padding:30px;max-width:1450px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.topbar h1{margin:0;font-size:30px;letter-spacing:-.7px}
.topbar p{margin:5px 0 0;color:var(--muted)}
.icon-btn{background:white;border:1px solid var(--line);border-radius:13px;padding:10px 13px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--card);border:1px solid #eee9e1;border-radius:var(--radius);padding:22px;box-shadow:0 7px 22px rgba(71,65,84,.035)}
.hero{grid-column:span 8;background:linear-gradient(135deg,#eeeafa,#f9f4ed)}
.stat-card{grid-column:span 4}
.progress-card{grid-column:span 6}
.quick-card{grid-column:span 6}
.card h2,.card h3{margin:0 0 9px}
.muted{color:var(--muted)}
.big{font-size:34px;font-weight:850}
.progress{height:9px;background:#eeeae4;border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:.35s}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pill{padding:7px 10px;border-radius:999px;background:white;border:1px solid var(--line);font-size:12px;color:#666}
.pill.done{background:var(--mint);border-color:transparent;color:#527b6b}
.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lesson-item{padding:16px;border:1px solid var(--line);border-radius:17px;background:white;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lesson-item button{padding:9px 12px;border-radius:11px;background:var(--lav2);color:var(--accent-dark);font-weight:700}
.section-card{margin-bottom:18px}
.section-head{display:flex;gap:13px;align-items:center;margin-bottom:17px}
.section-icon{width:47px;height:47px;border-radius:15px;display:grid;place-items:center;font-size:22px}
.section-head h2{margin:0}
.lesson-view{max-width:980px}
.back{background:transparent;color:var(--accent-dark);font-weight:700;padding:5px 0;margin-bottom:12px}
.lesson-title{font-size:35px;letter-spacing:-1px;margin:8px 0}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 22px}
.explain{font-size:16px;line-height:1.72}
.example{background:#f5f2f8;border-left:4px solid var(--accent);padding:15px 17px;border-radius:0 14px 14px 0;margin:16px 0}
.tip{background:#eef7f3;padding:15px;border-radius:15px;margin:16px 0}
.task{margin-top:24px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px}
.option{display:block;width:100%;text-align:left;padding:13px 15px;margin:8px 0;border:1px solid var(--line);border-radius:13px;background:#fff}
.option:hover{border-color:var(--accent)}
.option.correct{background:#e7f4ee;border-color:#9acbb7}
.option.wrong{background:#faeaea;border-color:#e1a3aa}
.feedback{margin-top:12px;padding:12px;border-radius:12px;background:var(--lav2);color:#62567e}
.next{margin-top:16px;background:var(--accent);color:white;padding:12px 18px;border-radius:13px;font-weight:800}
.exercise-input{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:13px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 12px;border-radius:12px;background:var(--blue);border:1px solid transparent}
.analytics{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar-row{margin:13px 0}
.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:12px;border-radius:99px;background:#eeeae4;overflow:hidden}
.bar span{display:block;height:100%;background:#b7a9d4;border-radius:99px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}
.badge{display:inline-block;padding:5px 8px;border-radius:9px;background:var(--peach);font-size:11px}
.empty{padding:35px;text-align:center;color:var(--muted)}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin:10px 0 17px;background:white}
@media(max-width:900px){
 .sidebar{width:80px;padding:15px 8px}.sidebar .logo span,.userbox .user-info,.nav-title,.nav button span,.logout span{display:none}
 .userbox{padding:10px}.main{margin-left:80px;width:calc(100% - 80px);padding:20px}
 .hero,.stat-card,.progress-card,.quick-card{grid-column:span 12}
 .lesson-list{grid-template-columns:1fr}
}
@media(max-width:600px){
 .main{padding:14px}.topbar h1{font-size:23px}.analytics{grid-template-columns:1fr}.lesson-title{font-size:28px}
}
</style>
</head>
<body>

<div id="authPage" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><div class="logo-icon">✦</div><span>AI Grammar Quest</span></div>
    <h1>Русская грамматика<br>как квест</h1>
    <p>Интерактивный тренажёр для изучения сложных грамматических конструкций: теория → практика → обратная связь → прогресс.</p>
    <div class="tabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">Вход</button>
      <button id="registerTab" onclick="showAuth('register')">Регистрация</button>
    </div>
    <form id="authForm" onsubmit="authSubmit(event)">
      <div id="nameField" class="field hidden"><label>Имя ученика</label><input id="nameInput" required></div>
      <div class="field"><label>Логин</label><input id="loginInput" required minlength="3"></div>
      <div class="field"><label>Пароль</label><input id="passwordInput" type="password" required minlength="4"></div>
      <button class="primary" id="authButton">Войти</button>
      <div id="authError" class="error"></div>
    </form>
    <div class="demo-note">Демо-версия: данные сохраняются локально в браузере через localStorage.</div>
  </div>
</div>

<div id="appPage" class="app hidden">
<aside class="sidebar">
  <div class="logo"><div class="logo-icon">✦</div><span>Grammar Quest</span></div>
  <div class="userbox">
    <div class="user-row"><div class="avatar" id="avatar">A</div><div class="user-info"><b id="sideName">Ученик</b><br><small id="sideLogin">@user</small></div></div>
  </div>
  <div class="nav-title">Обучение</div>
  <div class="nav">
    <button class="active" onclick="navigate('home',this)">⌂ <span>Главная</span></button>
    <button onclick="navigate('courses',this)">▣ <span>Разделы и уроки</span></button>
    <button onclick="navigate('practice',this)">✎ <span>Практика</span></button>
    <button onclick="navigate('analytics',this)">◔ <span>Моя аналитика</span></button>
  </div>
  <div class="nav-title">Аккаунт</div>
  <div class="nav">
    <button onclick="navigate('profile',this)">○ <span>Профиль</span></button>
  </div>
  <button class="logout" onclick="logout()">↪ <span>Выйти</span></button>
</aside>

<main class="main" id="main"></main>
</div>

<script>
const lessons = [
{sec:0,id:"p1",title:"Причастие: признак по действию",level:"Базовый",theory:"Причастие — особая форма глагола, которая обозначает признак предмета по действию и отвечает на вопросы какой? какая? какое? какие?",example:"На столе лежала книга, <b>открытая</b> учеником.",tip:"Чтобы распознать причастие, попробуй задать вопрос «какой?» и найти значение действия.",q:"В каком предложении есть причастие?",opts:["Ученик читает текст.","Прочитанная книга лежала на столе.","Ученик быстро записал ответ.","Книга была интересной."],a:1,exp:"«Прочитанная» обозначает признак книги по действию прочитать."},
{sec:0,id:"p2",title:"Действительные и страдательные причастия",level:"Базовый",theory:"Действительное причастие обозначает признак того, кто сам выполняет действие: читающий ученик. Страдательное — признак предмета, на который направлено действие: прочитанная книга.",example:"<b>Пишущий</b> ученик — сам пишет. <b>Написанная</b> работа — работа, которую написал кто-то.",tip:"Задай вопрос: предмет сам действует или действие совершают над ним?",q:"Какое словосочетание содержит страдательное причастие?",opts:["бегущий спортсмен","поющий артист","решённая задача","улыбающийся ребёнок"],a:2,exp:"Задачу решает кто-то другой, поэтому «решённая» — страдательное причастие."},
{sec:0,id:"p3",title:"Причастный оборот и его границы",level:"Средний",theory:"Причастие с зависимыми словами образует причастный оборот. В предложении важно определить всю группу слов, относящуюся к причастию.",example:"Дом, <b>построенный в прошлом году</b>, уже заселён.",tip:"Сначала найди причастие, затем задай к нему вопросы и выдели зависимые слова.",q:"Где находится причастный оборот?",opts:["Дом","построенный в прошлом году","в прошлом году","уже заселён"],a:1,exp:"Главное слово оборота — «построенный», зависимые слова — «в прошлом году»."},
{sec:0,id:"p4",title:"Обособление причастного оборота",level:"Продвинутый",theory:"Причастный оборот после определяемого существительного обычно обособляется: Дерево, покрытое снегом, стояло у дороги. Перед существительным оборот обычно не обособляется: Покрытое снегом дерево стояло у дороги.",example:"Картина, <b>написанная художником</b>, висела в зале.",tip:"Определи положение оборота относительно определяемого слова.",q:"Выбери правильную пунктуацию.",opts:["Картина написанная художником висела в зале.","Картина, написанная художником, висела в зале.","Картина, написанная художником висела в зале.","Картина написанная художником, висела в зале."],a:1,exp:"Оборот стоит после слова «картина» и обособляется с двух сторон."},

{sec:1,id:"d1",title:"Деепричастие: добавочное действие",level:"Базовый",theory:"Деепричастие обозначает добавочное действие при основном и отвечает на вопросы что делая? что сделав?",example:"<b>Читая</b> текст, ученик делал заметки.",tip:"В предложении должно быть одно и то же действующее лицо для основного и добавочного действия.",q:"Какое слово является деепричастием?",opts:["читающий","прочитанный","читая","чтение"],a:2,exp:"«Читая» отвечает на вопрос «что делая?»."},
{sec:1,id:"d2",title:"Деепричастный оборот",level:"Средний",theory:"Деепричастие вместе с зависимыми словами образует деепричастный оборот. Обычно он обособляется запятыми.",example:"<b>Закончив работу</b>, ученики вышли из класса.",tip:"Не путай деепричастный оборот с обычным обстоятельством: ищи добавочное действие.",q:"Как правильно расставить знаки?",opts:["Закончив работу ученики вышли.","Закончив работу, ученики вышли.","Закончив, работу ученики вышли.","Закончив работу ученики, вышли."],a:1,exp:"Деепричастный оборот «закончив работу» стоит в начале предложения и обособляется."},
{sec:1,id:"d3",title:"Главное и добавочное действие",level:"Средний",theory:"У деепричастия и сказуемого должно быть общее действующее лицо. Ошибка возникает, когда действие деепричастия относится не к тому субъекту.",example:"Неправильно: <i>Подъезжая к станции, у меня слетела шляпа.</i> Правильно: <i>Подъезжая к станции, я потерял шляпу.</i>",tip:"Подставь «кто?» к сказуемому и к деепричастию. Ответ должен совпасть.",q:"Какой вариант построен грамматически правильно?",opts:["Подходя к школе, начался дождь.","Подходя к школе, я увидел друга.","Прочитав книгу, у героя появились мысли.","Идя по улице, мне позвонили."],a:1,exp:"И «подходил», и «увидел» относится к одному действующему лицу — «я»."},
{sec:1,id:"d4",title:"Пунктуация при деепричастиях",level:"Продвинутый",theory:"Одиночное деепричастие и деепричастный оборот в большинстве случаев обособляются. Важно учитывать контекст и грамматическую роль конструкции.",example:"Он отвечал, <b>не задумываясь</b>. <b>Улыбнувшись</b>, девочка продолжила рассказ.",tip:"Сначала найди деепричастие, затем проверь, где начинается и заканчивается оборот.",q:"Выбери нормативный вариант.",opts:["Ученик слушал не перебивая учителя.","Ученик слушал, не перебивая учителя.","Ученик, слушал не перебивая учителя.","Ученик слушал не перебивая, учителя."],a:1,exp:"Оборот «не перебивая учителя» обособляется."},

{sec:2,id:"s1",title:"СПП: главное и придаточное",level:"Базовый",theory:"Сложноподчинённое предложение (СПП) состоит из главной и придаточной частей, связанных подчинительным союзом или союзным словом.",example:"Я знаю, <b>что ты придёшь</b>.",tip:"Найди грамматические основы и средство связи между частями.",q:"Какое предложение является СПП?",opts:["Наступил вечер, и город засветился.","Я вернулся домой, потому что начался дождь.","Наступил вечер и похолодало.","Тихий вечер."],a:1,exp:"Две грамматические основы связаны подчинительным союзом «потому что»."},
{sec:2,id:"s2",title:"Придаточные изъяснительные",level:"Средний",theory:"Изъяснительное придаточное раскрывает содержание мысли, речи, чувства или восприятия главной части. Часто отвечает на вопросы что? о чём? и присоединяется союзами что, чтобы, как, будто.",example:"Учитель объяснил, <b>что задание нужно выполнить сегодня</b>.",tip:"Попробуй заменить придаточное существительным: «Учитель объяснил содержание» — смысл сохраняется.",q:"Какой вопрос задаётся к изъяснительному придаточному?",opts:["где?","какой?","что?","несмотря на что?"],a:2,exp:"Изъяснительное раскрывает содержание мысли, речи, чувства и отвечает на вопросы косвенных падежей."},
{sec:2,id:"s3",title:"Придаточные определительные",level:"Средний",theory:"Определительное придаточное относится к существительному или местоимению в главной части и характеризует его. Часто используются союзные слова который, какой, где, когда.",example:"Мы посетили музей, <b>который находится в центре города</b>.",tip:"Задай вопрос «какой?» к существительному.",q:"Какое придаточное определительное?",opts:["Я знаю, что он пришёл.","Мы остановились там, где было тихо.","Книга, которую я прочитал, оказалась интересной.","Я ушёл, потому что устал."],a:2,exp:"Придаточная часть характеризует существительное «книга»: какая? которую я прочитал."},
{sec:2,id:"s4",title:"Придаточные обстоятельственные",level:"Продвинутый",theory:"Обстоятельственные придаточные обозначают условия, причины, цели, времени, места, следствия и другие обстоятельства действия.",example:"Мы остались дома, <b>потому что началась гроза</b>. Когда дождь закончился, мы вышли.",tip:"Определи смысловую связь: причина, время, условие, цель, место и т. д.",q:"Какой вид придаточного обозначает причину?",opts:["условное","причинное","целевое","определительное"],a:1,exp:"Придаточное причины отвечает на вопрос «почему?» и часто присоединяется союзами потому что, так как."},

{sec:3,id:"punc1",title:"Запятая между частями СПП",level:"Базовый",theory:"Главная и придаточная части СПП обычно разделяются запятой. Положение придаточной части может быть перед, после или внутри главной.",example:"<b>Когда начался урок</b>, ученики открыли тетради. Ученики открыли тетради, <b>когда начался урок</b>.",tip:"Сначала установи границы главной и придаточной частей.",q:"Выбери правильный вариант.",opts:["Когда начался урок ученики открыли тетради.","Когда начался урок, ученики открыли тетради.","Когда, начался урок ученики открыли тетради.","Когда начался, урок ученики открыли тетради."],a:1,exp:"Придаточная часть «Когда начался урок» отделяется запятой от главной."},
{sec:3,id:"punc2",title:"Запятые при причастном обороте",level:"Средний",theory:"Если причастный оборот стоит после определяемого существительного, он обычно выделяется запятыми. При одиночном причастии правила иные.",example:"Письмо, <b>полученное вчера</b>, лежало на столе.",tip:"Не ставь запятую автоматически: сначала найди определяемое слово и положение оборота.",q:"Где знаки поставлены верно?",opts:["Письмо полученное вчера лежало на столе.","Письмо, полученное вчера, лежало на столе.","Письмо полученное, вчера лежало на столе.","Письмо, полученное вчера лежало на столе."],a:1,exp:"Оборот стоит после определяемого слова и обособляется с двух сторон."},
{sec:3,id:"punc3",title:"Запятые при деепричастном обороте",level:"Средний",theory:"Деепричастные обороты обычно обособляются независимо от их положения в предложении.",example:"<b>Подойдя к окну</b>, он открыл штору. Он открыл штору, <b>подойдя к окну</b>.",tip:"Границы оборота определяются по вопросам от деепричастия к зависимым словам.",q:"Какой вариант правильный?",opts:["Подойдя к окну он открыл штору.","Подойдя к окну, он открыл штору.","Подойдя, к окну он открыл штору.","Подойдя к окну он, открыл штору."],a:1,exp:"Оборот стоит перед основной частью и отделяется запятой."},
{sec:3,id:"punc4",title:"Смешанный пунктуационный анализ",level:"Продвинутый",theory:"В одном предложении могут одновременно встречаться разные конструкции. Для анализа нужно установить грамматические основы, границы оборотов и средства связи.",example:"Когда прозвенел звонок, ученики, <b>закончившие работу</b>, вышли из класса, <b>улыбаясь</b>.",tip:"Разбирай предложение по уровням: основы → СПП → причастный оборот → деепричастный оборот.",q:"Сколько обособленных конструкций в примере?",opts:["0","1","2","3"],a:2,exp:"Есть причастный оборот «закончившие работу» и деепричастный оборот «улыбаясь» — всего две конструкции."},

{sec:4,id:"style1",title:"Грамматическая связь слов",level:"Базовый",theory:"Словосочетание строится на смысловой и грамматической связи слов. Основные типы связи: согласование, управление и примыкание.",example:"интересная книга — согласование; читать книгу — управление; говорить тихо — примыкание.",tip:"Определи, изменяется ли зависимое слово вместе с главным.",q:"Какой тип связи в словосочетании «интересная книга»?",opts:["управление","примыкание","согласование","нет связи"],a:2,exp:"При изменении главного слова зависимое изменяется: интересная книга — интересной книги."},
{sec:4,id:"style2",title:"Согласование подлежащего и сказуемого",level:"Средний",theory:"Подлежащее и сказуемое должны грамматически сочетаться. При сложных случаях учитываются значение, форма и порядок слов.",example:"Большинство учеников <b>выполнило</b> работу. Ученики <b>выполнили</b> работу.",tip:"Не ориентируйся только на ближайшее существительное: найди грамматическую основу полностью.",q:"Выбери нормативный вариант.",opts:["Ученики выполнил работу.","Большинство учеников выполнили работу.","Большинство учеников выполнило работу.","Ученики выполнила работу."],a:2,exp:"При подлежащем «большинство» сказуемое в данном контексте согласуется в единственном числе."},
{sec:4,id:"style3",title:"Нормы построения сложных предложений",level:"Продвинутый",theory:"При построении сложного предложения важно избегать неоправданного нагромождения частей, нарушения связи между союзами и двусмысленности.",example:"Лучше: Я понял, <b>что нужно повторить тему, которую мы изучали вчера</b>.",tip:"Проверь, к какому слову относится каждое придаточное и можно ли однозначно восстановить смысл.",q:"Что прежде всего проверяют при построении СПП?",opts:["Только длину предложения","Логику связи частей и средства связи","Только количество запятых","Только наличие существительных"],a:1,exp:"Синтаксическая структура должна быть логичной, а связь частей — грамматически и смыслово ясной."},
{sec:4,id:"style4",title:"Редактирование грамматической ошибки",level:"Продвинутый",theory:"Редактирование — важный этап грамотного письма. Нужно не просто увидеть ошибку, но определить её тип и исправить конструкцию.",example:"Ошибка: «Подъезжая к школе, у меня зазвонил телефон». Исправление: «Когда я подъезжал к школе, у меня зазвонил телефон».",tip:"Назови тип ошибки до исправления: это помогает выбрать правильный способ редактирования.",q:"Какой тип ошибки в предложении «Читая книгу, мне стало интересно»?",opts:["Нарушение связи при деепричастном обороте","Ошибка в образовании существительного","Ошибка в согласовании прилагательного","Ошибок нет"],a:0,exp:"Деепричастие «читая» должно относиться к действующему лицу, которого нет в главной части."},

{sec:5,id:"quest1",title:"Грамматический квест: найди конструкцию",level:"Повторение",theory:"Финальный режим объединяет несколько тем. Сначала распознай конструкцию, затем объясни свой выбор.",example:"Ученик, <b>подготовивший доклад</b>, выступил, <b>уверенно отвечая на вопросы</b>.",tip:"Используй алгоритм: 1) основы; 2) причастия; 3) деепричастия; 4) границы; 5) пунктуация.",q:"Какая конструкция выделена: «подготовивший доклад»?",opts:["деепричастный оборот","причастный оборот","придаточное предложение","вводная конструкция"],a:1,exp:"«Подготовивший» — причастие, а зависимое слово «доклад» образует причастный оборот."},
{sec:5,id:"quest2",title:"Грамматический квест: СПП",level:"Повторение",theory:"На этом этапе важно быстро определить вид связи и смысл придаточной части.",example:"Я открыл окно, <b>потому что в комнате было душно</b>.",tip:"Союз «потому что» указывает на причинное значение придаточного.",q:"Какой вид придаточного в примере?",opts:["определительное","изъяснительное","причинное","целевое"],a:2,exp:"Придаточная часть отвечает на вопрос «почему открыл окно?» — причинное значение."},
{sec:5,id:"quest3",title:"Грамматический квест: исправь",level:"Итоговый",theory:"Исправление ошибок требует комплексного применения правил.",example:"Ошибка: «Изучая правило, предложение показалось мне сложным». Исправление: «Изучая правило, я понял, что предложение сложное».",tip:"Если видишь деепричастие, сразу проверь его действующее лицо.",q:"Как лучше исправить: «Изучая правило, задание стало понятнее»?",opts:["Изучая правило, задание стало понятнее.","Изучая правило, я лучше понял задание.","Изучая правило, понятнее стало задание.","Все варианты одинаково нормативны."],a:1,exp:"У деепричастия «изучая» и сказуемого «понял» один субъект — «я»."},
{sec:5,id:"quest4",title:"Финальный тест",level:"Итоговый",theory:"Финальный урок проверяет распознавание и применение основных конструкций проекта: причастных и деепричастных оборотов, СПП и пунктуации.",example:"Когда закончился урок, ученики, <b>выполнившие задания</b>, вышли из класса, <b>обсуждая результаты</b>.",tip:"Постарайся объяснять ответ, а не угадывать: это закрепляет правило.",q:"Какая конструкция «обсуждая результаты»?",opts:["причастный оборот","деепричастный оборот","придаточное определительное","словосочетание с согласованием"],a:1,exp:"«Обсуждая» отвечает на вопрос «что делая?» и имеет зависимые слова «результаты»."}
];

const sections=[
{name:"Причастие",icon:"◌",color:"lav",desc:"От образования причастий до обособления причастных оборотов."},
{name:"Деепричастие",icon:"↗",color:"mint",desc:"Добавочное действие, обороты и типичные грамматические ошибки."},
{name:"СПП",icon:"⌁",color:"blue",desc:"Главная и придаточная части, виды придаточных."},
{name:"Пунктуация",icon:"•",color:"peach",desc:"Системный разбор знаков препинания в сложных конструкциях."},
{name:"Грамматические нормы",icon:"✓",color:"yellow",desc:"Связь слов, согласование и редактирование текста."},
{name:"Финальный квест",icon:"★",color:"pink",desc:"Комплексное закрепление всех изученных тем."}
];

let currentUser=null,currentLesson=null,authMode="login";
function users(){return JSON.parse(localStorage.getItem("agq_users")||"{}")}
function saveUsers(u){localStorage.setItem("agq_users",JSON.stringify(u))}
function userKey(){return "agq_progress_"+currentUser.login}
function progress(){return JSON.parse(localStorage.getItem(userKey())||JSON.stringify({done:[],scores:{},errors:{},attempts:0}))}
function saveProgress(p){localStorage.setItem(userKey(),JSON.stringify(p))}
function showAuth(mode){
 authMode=mode; document.getElementById("loginTab").classList.toggle("active",mode==="login");
 document.getElementById("registerTab").classList.toggle("active",mode==="register");
 document.getElementById("nameField").classList.toggle("hidden",mode!=="register");
 document.getElementById("nameInput").required=mode==="register";
 document.getElementById("authButton").textContent=mode==="register"?"Создать аккаунт":"Войти";
 document.getElementById("authError").textContent="";
}
function authSubmit(e){
 e.preventDefault(); const login=document.getElementById("loginInput").value.trim().toLowerCase();
 const pass=document.getElementById("passwordInput").value; const us=users();
 if(authMode==="register"){
   if(us[login]){document.getElementById("authError").textContent="Такой логин уже существует.";return}
   us[login]={name:document.getElementById("nameInput").value.trim()||"Ученик",password:pass}; saveUsers(us);
   currentUser={login,name:us[login].name}; localStorage.setItem("agq_current",login); enterApp();
 }else{
   if(!us[login]||us[login].password!==pass){document.getElementById("authError").textContent="Неверный логин или пароль.";return}
   currentUser={login,name:us[login].name}; localStorage.setItem("agq_current",login); enterApp();
 }
}
function enterApp(){
 document.getElementById("authPage").classList.add("hidden");document.getElementById("appPage").classList.remove("hidden");
 document.getElementById("sideName").textContent=currentUser.name;document.getElementById("sideLogin").textContent="@"+currentUser.login;
 document.getElementById("avatar").textContent=(currentUser.name[0]||"У").toUpperCase();navigate("home");
}
function logout(){localStorage.removeItem("agq_current");currentUser=null;document.getElementById("appPage").classList.add("hidden");document.getElementById("authPage").classList.remove("hidden");}
function pct(){return Math.round(progress().done.length/lessons.length*100)}
function navigate(page,btn){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");
 if(page==="home")renderHome(); if(page==="courses")renderCourses();if(page==="practice")renderPractice();if(page==="analytics")renderAnalytics();if(page==="profile")renderProfile();
}
function header(title,sub){return `<div class="topbar"><div><h1>${title}</h1><p>${sub}</p></div><button class="icon-btn" onclick="navigate('profile')">⚙</button></div>`}
function renderHome(){
 const p=progress(),done=p.done.length;
 document.getElementById("main").innerHTML=header("Привет, "+currentUser.name+"!","Продолжим грамматический квест?")+
 `<div class="grid">
 <div class="card hero"><h2>Твой прогресс</h2><p class="muted">Проходи уроки последовательно или выбирай тему, которую хочешь повторить.</p>
 <div style="display:flex;align-items:end;gap:15px;margin:25px 0 13px"><span class="big">${pct()}%</span><span class="muted">${done} из ${lessons.length} уроков</span></div><div class="progress"><span style="width:${pct()}%"></span></div>
 <div class="pills">${sections.map((s,i)=>`<span class="pill ${lessons.filter(x=>x.sec===i).every(x=>p.done.includes(x.id))?'done':''}">${s.icon} ${s.name}</span>`).join("")}</div></div>
 <div class="card stat-card"><h3>⭐ Заданий выполнено</h3><div class="big">${p.attempts}</div><p class="muted">Ответы сохраняются автоматически.</p></div>
 <div class="card progress-card"><h3>Продолжить обучение</h3><p class="muted">${done<lessons.length?"Следующий урок ждёт тебя.":"Все уроки завершены — отличная работа!"}</p><button class="next" onclick="openLesson('${lessons.find(x=>!p.done.includes(x.id))?.id||lessons[lessons.length-1].id}')">${done<lessons.length?"Открыть следующий":"Повторить финальный"}</button></div>
 <div class="card quick-card"><h3>🧠 Умный разбор ошибок</h3><p class="muted">Система группирует ошибки по темам и показывает, что стоит повторить.</p><button class="next" onclick="navigate('analytics')">Посмотреть аналитику</button></div>
 </div>`;
}
function renderCourses(){
 const p=progress();
 document.getElementById("main").innerHTML=header("Разделы и уроки","24 неповторяющихся урока: от основ до комплексного анализа.")+
 sections.map((s,i)=>`<div class="card section-card"><div class="section-head"><div class="section-icon" style="background:var(--${s.color})">${s.icon}</div><div><h2>${s.name}</h2><div class="muted">${s.desc}</div></div></div>
 <div class="lesson-list">${lessons.filter(x=>x.sec===i).map(x=>`<div class="lesson-item"><div><b>${p.done.includes(x.id)?"✓ ":""}${x.title}</b><div class="muted" style="font-size:12px;margin-top:5px">${x.level}</div></div><button onclick="openLesson('${x.id}')">${p.done.includes(x.id)?"Повторить":"Начать"}</button></div>`).join("")}</div></div>`).join("");
}
function openLesson(id){
 currentLesson=lessons.find(x=>x.id===id);renderLesson();
}
function renderLesson(){
 const l=currentLesson,p=progress();
 document.getElementById("main").innerHTML=`<div class="lesson-view"><button class="back" onclick="navigate('courses')">← Все разделы</button>
 <div class="card"><div class="lesson-meta"><span class="pill">${sections[l.sec].name}</span><span class="pill">${l.level}</span>${p.done.includes(l.id)?'<span class="pill done">✓ Пройдено</span>':''}</div>
 <h1 class="lesson-title">${l.title}</h1><div class="explain">${l.theory}</div>
 <div class="example">${l.example}</div><div class="tip"><b>💡 Подсказка:</b> ${l.tip}</div>
 <div class="task"><h3>Проверь себя</h3><p>${l.q}</p>${l.opts.map((o,i)=>`<button class="option" id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
 <div id="feedback"></div><button id="nextLesson" class="next hidden" onclick="completeAndNext()">Продолжить →</button></div></div></div>`;
}
function answer(i){
 const l=currentLesson,p=progress();p.attempts++;let ok=i===l.a;
 p.errors[l.id]=p.errors[l.id]||0;if(!ok)p.errors[l.id]++;saveProgress(p);
 document.querySelectorAll(".option").forEach((b,n)=>{b.disabled=true;if(n===l.a)b.classList.add("correct");if(n===i&&!ok)b.classList.add("wrong")});
 document.getElementById("feedback").innerHTML=`<div class="feedback">${ok?"✅ Верно! ":"❌ Пока не совсем. "}${l.exp}</div>`;
 document.getElementById("nextLesson").classList.remove("hidden");
}
function completeAndNext(){
 const p=progress();if(!p.done.includes(currentLesson.id))p.done.push(currentLesson.id);saveProgress(p);
 const idx=lessons.findIndex(x=>x.id===currentLesson.id);const next=lessons[idx+1];
 if(next)openLesson(next.id);else navigate("home");
}
function renderPractice(){
 const p=progress();
 document.getElementById("main").innerHTML=header("Практика","Повторяй задания без привязки к порядку уроков.")+
 `<div class="card"><input class="search" id="practiceSearch" placeholder="Поиск по теме или уроку..." oninput="filterPractice()"><div id="practiceList">${practiceList(lessons,p)}</div></div>`;
}
function practiceList(arr,p){return `<div class="lesson-list">${arr.map(l=>`<div class="lesson-item"><div><b>${l.title}</b><div class="muted">${sections[l.sec].name} · ${l.level} · ошибок: ${p.errors[l.id]||0}</div></div><button onclick="openLesson('${l.id}')">Тренироваться</button></div>`).join("")}</div>`}
function filterPractice(){const q=document.getElementById("practiceSearch").value.toLowerCase();const p=progress();document.getElementById("practiceList").innerHTML=practiceList(lessons.filter(l=>(l.title+" "+sections[l.sec].name).toLowerCase().includes(q)),p)}
function renderAnalytics(){
 const p=progress();
 const groups=sections.map((s,i)=>{let ls=lessons.filter(l=>l.sec===i),attempt=0,errors=0;ls.forEach(l=>{attempt+=p.errors[l.id]||0;errors+=p.done.includes(l.id)?0:1});return {s,attempt,done:ls.filter(l=>p.done.includes(l.id)).length,total:ls.length}});
 document.getElementById("main").innerHTML=header("Моя аналитика","Сравнение прогресса и типичных ошибок.")+
 `<div class="analytics"><div class="card"><h2>Прогресс по разделам</h2>${groups.map(g=>`<div class="bar-row"><div class="bar-label"><span>${g.s.icon} ${g.s.name}</span><b>${Math.round(g.done/g.total*100)}%</b></div><div class="bar"><span style="width:${g.done/g.total*100}%"></span></div></div>`).join("")}</div>
 <div class="card"><h2>Систематизация ошибок</h2>${groups.map(g=>`<div class="bar-row"><div class="bar-label"><span>${g.s.name}</span><b>${g.attempt} ошиб.</b></div><div class="bar"><span style="width:${Math.min(100,g.attempt*18)}%"></span></div></div>`).join("")}</div></div>
 <div class="card" style="margin-top:18px"><h2>Сопоставление результатов</h2><table><tr><th>Раздел</th><th>Уроков</th><th>Пройдено</th><th>Ошибки</th><th>Рекомендация</th></tr>${groups.map(g=>`<tr><td>${g.s.name}</td><td>${g.total}</td><td>${g.done}</td><td>${g.attempt}</td><td>${g.attempt>2?"Повторить теорию и пройти практику":"Продолжать в том же темпе"}</td></tr>`).join("")}</table></div>`;
}
function renderProfile(){
 const us=users();
 document.getElementById("main").innerHTML=header("Профиль","Настройки локального учебного аккаунта.")+
 `<div class="card" style="max-width:700px"><div class="user-row" style="margin-bottom:20px"><div class="avatar">${currentUser.name[0].toUpperCase()}</div><div><h2 style="margin:0">${currentUser.name}</h2><span class="muted">@${currentUser.login}</span></div></div>
 <div class="field"><label>Имя</label><input id="profileName" value="${currentUser.name.replace(/"/g,'&quot;')}"></div>
 <button class="next" onclick="saveProfile()">Сохранить изменения</button>
 <hr style="border:0;border-top:1px solid var(--line);margin:25px 0">
 <h3>О сохранении данных</h3><p class="muted">В этой демонстрационной версии аккаунт и прогресс хранятся только в localStorage этого браузера. Это удобно для прототипа научного проекта, но не является безопасной серверной авторизацией.</p>
 </div>`;
}
function saveProfile(){const n=document.getElementById("profileName").value.trim()||"Ученик";const us=users();us[currentUser.login].name=n;saveUsers(us);currentUser.name=n;enterApp()}
window.addEventListener("load",()=>{const login=localStorage.getItem("agq_current"),us=users();if(login&&us[login]){currentUser={login,name:us[login].name};enterApp()}});
</script>

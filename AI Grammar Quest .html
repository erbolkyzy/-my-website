<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#f8f7fb;--text:#363443;--muted:#858294;--pink:#e8cbd9;--pd:#c89db5;--blue:#cbddea;--green:#cfe3d7;--yellow:#f1e5bd;--purple:#ddd2ea;--border:#ece9f0;--shadow:0 10px 35px rgba(70,60,90,.07)}
body{font-family:Nunito,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input{font-family:inherit}button{cursor:pointer}.hidden{display:none!important}
#authPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 15%,#f0dce7 0,transparent 30%),radial-gradient(circle at 85% 85%,#dce9f2 0,transparent 30%),var(--bg)}
.auth-card{width:100%;max-width:430px;background:white;border:1px solid var(--border);border-radius:30px;padding:40px 32px;box-shadow:var(--shadow)}.logo{text-align:center;margin-bottom:28px}.logo-icon{width:70px;height:70px;border-radius:22px;margin:auto;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,var(--pink),var(--purple))}.logo h1{margin-top:15px;font-size:28px}.logo p{color:var(--muted);margin-top:5px}.tabs{display:flex;background:#f6f4f8;padding:5px;border-radius:14px;margin-bottom:22px}.tabs button{width:50%;border:0;background:transparent;padding:11px;border-radius:10px;color:var(--muted);font-weight:700}.tabs button.active{background:white;color:var(--text);box-shadow:0 3px 10px #0000000d}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:13px;outline:none}.field input:focus{border-color:var(--pd)}.primary{width:100%;border:0;padding:14px;border-radius:14px;background:var(--text);color:#fff;font-weight:800;margin-top:5px}.error{color:#b86d7f;font-size:13px;margin:10px 0;text-align:center}
#app{display:none}.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:white;border-right:1px solid var(--border);padding:25px 16px;z-index:20}.side-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:5px 10px 25px}.side-logo span{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--pink)}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:13px;color:var(--muted);font-weight:700}.nav button:hover,.nav button.active{background:#f6f2f6;color:var(--text)}.logout{position:absolute;bottom:25px;left:16px;right:16px;border:1px solid var(--border);background:white;padding:11px;border-radius:12px;color:var(--muted)}
.main{margin-left:245px;padding:30px;max-width:1400px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.greeting h2{font-size:27px}.greeting p{color:var(--muted);margin-top:4px}.profile-mini{display:flex;align-items:center;gap:12px}.avatar{width:45px;height:45px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--purple);font-weight:800}.mobile-menu{display:none;border:0;background:white;padding:10px 13px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat,.course,.chart-card,.profile-card,.lesson,.quiz-card{background:white;border:1px solid var(--border);box-shadow:var(--shadow)}.stat{border-radius:20px;padding:20px}.stat-icon{font-size:23px}.stat-value{font-size:26px;font-weight:800;margin-top:8px}.stat-name{color:var(--muted);font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}.section-title h3{font-size:20px}
.hero{background:linear-gradient(120deg,#eee1e8,#e2eaf1);border-radius:25px;padding:28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.hero-text{max-width:650px}.hero h2{font-size:25px;margin-bottom:8px}.hero p{color:#6e6a77;line-height:1.6}.hero button{border:0;padding:13px 20px;border-radius:13px;background:white;font-weight:800}.progress-box{margin-top:18px}.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:var(--pd);border-radius:20px;transition:.5s}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.course{border-radius:21px;padding:21px}.course-icon{width:47px;height:47px;display:flex;align-items:center;justify-content:center;border-radius:15px;font-size:22px;margin-bottom:15px}.course:nth-child(1) .course-icon{background:var(--pink)}.course:nth-child(2) .course-icon{background:var(--blue)}.course:nth-child(3) .course-icon{background:var(--green)}.course:nth-child(4) .course-icon{background:var(--yellow)}.course:nth-child(5) .course-icon{background:var(--purple)}.course:nth-child(6) .course-icon{background:#e7ddd3}.course h4{font-size:17px}.course p{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 15px}.course button{border:0;background:#f5f2f6;padding:10px 14px;border-radius:11px;font-weight:700}.lesson-list{display:grid;gap:12px}.lesson{padding:18px 20px;border-radius:18px;display:flex;align-items:center;justify-content:space-between}.lesson-left{display:flex;align-items:center;gap:15px}.lesson-number{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#f3edf2;font-weight:800}.lesson h4{font-size:15px}.lesson p{color:var(--muted);font-size:12px;margin-top:3px}.lesson button{border:0;background:var(--text);color:white;padding:9px 14px;border-radius:10px;font-weight:700}
.quiz-card{max-width:760px;margin:auto;border-radius:25px;padding:28px}.quiz-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:25px}.question{font-size:21px;line-height:1.45;font-weight:800;margin-bottom:22px}.answers{display:grid;gap:10px}.answer{border:1px solid var(--border);background:#fbfafc;padding:14px;border-radius:13px;text-align:left;font-size:14px}.answer.correct{background:#e5f1e9;border-color:#a8c9b4}.answer.wrong{background:#f5e4e8;border-color:#d9a9b5}.explanation{margin-top:15px;padding:14px;border-radius:13px;background:#f7f4f8;color:#686472;line-height:1.5;font-size:14px}.next-btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:13px;background:var(--text);color:white;font-weight:800}
.chart-card,.profile-card{border-radius:22px;padding:25px}.chart-row{margin:18px 0}.chart-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:13px;background:#f0eef2;border-radius:20px;overflow:hidden}.bar-fill{height:100%;border-radius:20px}.before{background:#d8b8c6}.after{background:#9db9ca}.big-avatar{width:80px;height:80px;background:var(--purple);border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin-bottom:15px}.badges{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.badge{background:#f5f2f7;padding:12px 15px;border-radius:14px;font-size:13px}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px}.stats{grid-template-columns:repeat(2,1fr)}.course-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.sidebar{display:none}.main{margin-left:0;padding:18px}.mobile-menu{display:block}.topbar{gap:10px}.hero{flex-direction:column;align-items:flex-start;gap:18px}.stats{grid-template-columns:1fr 1fr}.course-grid{grid-template-columns:1fr}.lesson{gap:10px}.lesson button{white-space:nowrap}}
</style></head>
<body>
<div id="authPage"><div class="auth-card"><div class="logo"><div class="logo-icon">✦</div><h1>AI Grammar Quest</h1><p>Изучай грамматику как игру</p></div><div class="tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Вход</button><button id="registerTab" onclick="showAuth('register')">Регистрация</button></div><div id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="Введите email"></div><div class="field"><label>Пароль</label><input id="loginPassword" type="password" placeholder="Введите пароль"></div><div id="loginError" class="error"></div><button class="primary" onclick="login()">Войти</button></div><div id="registerForm" class="hidden"><div class="field"><label>Имя</label><input id="regName" placeholder="Например, Анель"></div><div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="Введите email"></div><div class="field"><label>Пароль</label><input id="regPassword" type="password" placeholder="Минимум 6 символов"></div><div id="registerError" class="error"></div><button class="primary" onclick="register()">Создать аккаунт</button></div></div></div>
<div id="app"><aside class="sidebar"><div class="side-logo"><span>✦</span>AI Grammar Quest</div><nav class="nav"><button class="active" onclick="navigate('home',this)">⌂ Главная</button><button onclick="navigate('courses',this)">▣ Разделы</button><button onclick="navigate('diagnostic',this)">◈ Диагностика</button><button onclick="navigate('analytics',this)">◫ Аналитика</button><button onclick="navigate('profile',this)">♙ Профиль</button></nav><button class="logout" onclick="logout()">Выйти из аккаунта</button></aside><main class="main"><div class="topbar"><button class="mobile-menu" onclick="toggleMobile()">☰</button><div class="greeting"><h2 id="greeting">Добро пожаловать!</h2><p>Продолжим изучение русского языка?</p></div><div class="profile-mini"><div><b id="miniName"></b><div style="font-size:12px;color:var(--muted)">Ученик</div></div><div class="avatar" id="miniAvatar">А</div></div></div><div id="content"></div></main></div>
<script>
const U='grammarQuestUsers',S='grammarQuestSession';function users(){return JSON.parse(localStorage.getItem(U)||'{}')}function save(x){localStorage.setItem(U,JSON.stringify(x))}function me(){let s=localStorage.getItem(S),u=users();return s?u[s]:null}function upd(x){let s=localStorage.getItem(S),u=users();if(s&&u[s]){u[s]=x;save(u)}}function showAuth(t){loginForm.classList.toggle('hidden',t!=='login');registerForm.classList.toggle('hidden',t!=='register');loginTab.classList.toggle('active',t==='login');registerTab.classList.toggle('active',t==='register')}
function register(){let n=regName.value.trim(),e=regEmail.value.trim().toLowerCase(),p=regPassword.value,x=users();registerError.textContent='';if(!n||!e||!p)return registerError.textContent='Заполните все поля.';if(p.length<6)return registerError.textContent='Пароль должен содержать минимум 6 символов.';if(x[e])return registerError.textContent='Аккаунт с таким email уже существует.';x[e]={name:n,email:e,password:p,stars:0,streak:0,completed:[],mistakes:{participle:0,gerund:0,spp:0,punctuation:0},before:null,after:null};save(x);localStorage.setItem(S,e);openApp()}function login(){let e=loginEmail.value.trim().toLowerCase(),p=loginPassword.value,x=users();loginError.textContent='';if(!x[e]||x[e].password!==p)return loginError.textContent='Неверный email или пароль.';localStorage.setItem(S,e);openApp()}function logout(){localStorage.removeItem(S);app.style.display='none';authPage.style.display='flex';showAuth('login')}function openApp(){authPage.style.display='none';app.style.display='block';let u=me();greeting.textContent='Привет, '+u.name+'! 👋';miniName.textContent=u.name;miniAvatar.textContent=u.name[0].toUpperCase();renderHome()}
const sections=[['participle','🌸','Причастие','Образование, виды, обороты и пунктуация.',6],['gerund','🌿','Деепричастие','Добавочное действие и деепричастные обороты.',6],['spp','🪻','СПП','Сложноподчинённые предложения и виды придаточных.',8],['punctuation','🫧','Пунктуация','Запятые и другие знаки в сложных конструкциях.',6],['syntax','📖','Синтаксис','Связи слов и построение грамотных предложений.',6],['style','☁️','Грамматика в тексте','Применяем знания в реальной письменной речи.',6]];
const lessonNames={participle:['Причастие как часть речи','Действительные причастия','Страдательные причастия','Причастный оборот','Пунктуация при причастном обороте','Причастия в тексте'],gerund:['Деепричастие как часть речи','Образование деепричастий','Деепричастный оборот','Пунктуация с деепричастиями','Грамматическая связь','Использование в письменной речи'],spp:['Строение СПП','Подчинительные союзы','Союзные слова','Придаточные определительные','Придаточные изъяснительные','Придаточные обстоятельственные','Схемы СПП','Конструирование СПП'],punctuation:['Запятая при причастии','Запятая при деепричастии','Запятая между частями СПП','Однородные конструкции','Сложные случаи','Пунктуационный практикум'],syntax:['Словосочетание','Простое предложение','Односоставные предложения','Осложнённые предложения','Сложные предложения','Синтаксический разбор'],style:['Редактируем текст','Грамматическая связность','Сложные предложения в эссе','Научный стиль','Публицистический стиль','Итоговый грамматический квест']};
const qs={participle:[['В каком предложении есть причастный оборот?',['Ученики внимательно слушали.','Ученики, изучающие тему, записывали правила.','Ученики изучают тему.','Ученики сделали записи.'],1,'«Изучающие тему» — причастие с зависимыми словами.'],['Что обозначает причастие?',['Только предмет','Признак предмета по действию','Только действие','Количество предметов'],1,'Причастие обозначает признак предмета по действию.'],['Где правильно расставлены знаки?',['Книга лежащая на столе принадлежит мне.','Книга, лежащая на столе, принадлежит мне.','Книга лежащая, на столе принадлежит мне.','Книга, лежащая на столе принадлежит мне.'],1,'Оборот после определяемого слова обособляется с двух сторон.']],gerund:[['Найдите деепричастный оборот:',['прочитанная книга','читая книгу','интересная книга','книга ученика'],1,'«Читая книгу» обозначает добавочное действие.'],['Выберите правильное предложение:',['Читая книгу ученик делал заметки.','Читая книгу, ученик делал заметки.','Читая, книгу ученик делал заметки.','Читая книгу ученик, делал заметки.'],1,'Деепричастный оборот обособляется запятой.'],['Найдите ошибочное предложение:',['Улыбаясь, девочка вошла.','Подойдя к окну, ученик посмотрел.','Читая книгу, мне стало интересно.','Закончив работу, ученик вышел.'],2,'Деепричастие должно относиться к действующему лицу.']],spp:[['Какое предложение является СПП?',['Наступил вечер.','Солнце село, и стало прохладно.','Я знаю, что ты придёшь.','Солнце светит ярко.'],2,'Части СПП связаны подчинительной связью.'],['Какой союз вводит придаточное причины?',['если','потому что','который','чтобы'],1,'«Потому что» выражает причинное значение.'],['Выберите правильную пунктуацию:',['Я знаю что ты придёшь.','Я знаю, что ты придёшь.','Я знаю что, ты придёшь.','Я, знаю что ты придёшь.'],1,'Придаточная часть отделяется запятой.']],punctuation:[['Выберите правильный вариант:',['Читая книгу ученик делал заметки.','Читая книгу, ученик делал заметки.','Читая, книгу ученик делал заметки.','Читая книгу ученик, делал заметки.'],1,'Деепричастный оборот обособляется.'],['Где нужна запятая?',['Я знаю что ты прав.','Я знаю, что ты прав.','Я, знаю что ты прав.','Я знаю что, ты прав.'],1,'Придаточная часть отделяется запятой.'],['Когда наступил вечер мы вернулись домой.',['Когда наступил вечер, мы вернулись домой.','Когда, наступил вечер мы вернулись домой.','Когда наступил, вечер мы вернулись домой.'],1,'Придаточная часть перед главной отделяется запятой.']]};
let state={};function nav(p,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b&&b.classList.add('active');({home:renderHome,courses:renderCourses,diagnostic:renderDiagnostic,analytics:renderAnalytics,profile:renderProfile}[p])()}function level(s){return s>=100?'Эксперт':s>=60?'Продвинутый':s>=30?'Практик':s>=10?'Ученик':'Новичок'}
function renderHome(){let u=me(),total=38,d=u.completed.length,p=Math.round(d/total*100);content.innerHTML=`<div class="hero"><div class="hero-text"><h2>Твой путь к грамотной речи ✨</h2><p>Проходи уроки, выполняй задания, исправляй ошибки и постепенно повышай свой уровень русского языка.</p><div class="progress-box"><div style="font-size:12px;margin-bottom:5px">Общий прогресс — ${p}%</div><div class="progress"><div class="progress-fill" style="width:${p}%"></div></div></div></div><button onclick="renderCourses()">Продолжить →</button></div><div class="stats"><div class="stat"><div class="stat-icon">⭐</div><div class="stat-value">${u.stars}</div><div class="stat-name">Звёзды</div></div><div class="stat"><div class="stat-icon">🔥</div><div class="stat-value">${u.streak}</div><div class="stat-name">Серия занятий</div></div><div class="stat"><div class="stat-icon">📚</div><div class="stat-value">${d}</div><div class="stat-name">Уроков завершено</div></div><div class="stat"><div class="stat-icon">🏆</div><div class="stat-value">${level(u.stars)}</div><div class="stat-name">Уровень</div></div></div><div class="section-title"><h3>Рекомендуем начать</h3></div><div class="course-grid">${sections.slice(0,3).map(s=>card(s)).join('')}</div>`}function card(s){return `<div class="course"><div class="course-icon">${s[1]}</div><h4>${s[2]}</h4><p>${s[3]}</p><button onclick="openSection('${s[0]}')">Начать</button></div>`}
function renderCourses(){content.innerHTML=`<div class="section-title"><h3>Разделы обучения</h3></div><div class="course-grid">${sections.map(card).join('')}</div>`}function openSection(id){let s=sections.find(x=>x[0]===id),u=me();content.innerHTML=`<div class="section-title"><div><h3>${s[1]} ${s[2]}</h3><p style="color:var(--muted)">${s[3]}</p></div></div><div class="lesson-list">${lessonNames[id].map((n,i)=>`<div class="lesson"><div class="lesson-left"><div class="lesson-number">${i+1}</div><div><h4>${n}</h4><p>Практическое задание и проверка знаний.</p></div></div><button onclick="startLesson('${id}',${i})">${u.completed.includes(id+'-'+i)?'Повторить':'Начать'}</button></div>`).join('')}</div>`}
function startLesson(sec,i){let q=qs[sec]||qs.punctuation;state={sec,lesson:i,questions:[...q,...q].slice(0,5),i:0,score:0,answered:false};question()}function question(){let q=state.questions[state.i];content.innerHTML=`<div class="quiz-card"><div class="quiz-head"><span>${state.sec.toUpperCase()}</span><span>Вопрос ${state.i+1} из ${state.questions.length}</span></div><div class="progress" style="margin-bottom:25px"><div class="progress-fill" style="width:${state.i/state.questions.length*100}%"></div></div><div class="question">${q[0]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" id="a${i}" onclick="answer(${i})">${a}</button>`).join('')}</div><div id="explanation"></div><button id="next" class="next-btn hidden" onclick="nextQ()">${state.i===state.questions.length-1?'Завершить':'Следующий вопрос'}</button></div>`}function answer(i){if(state.answered)return;state.answered=true;let q=state.questions[state.i];document.querySelectorAll('.answer').forEach((b,j)=>j===q[2]&&b.classList.add('correct'));if(i===q[2])state.score++;else{document.getElementById('a'+i).classList.add('wrong');let u=me();if(u.mistakes[state.sec]!==undefined)u.mistakes[state.sec]++;upd(u)}explanation.innerHTML=`<div class="explanation"><b>${i===q[2]?'Правильно! ⭐':'Разберём ошибку:'}</b><br>${q[3]}</div>`;next.classList.remove('hidden')}function nextQ(){if(state.i<state.questions.length-1){state.i++;state.answered=false;question()}else finish()}function finish(){let u=me(),key=state.sec+'-'+state.lesson;if(!u.completed.includes(key)){u.completed.push(key);u.stars+=state.score*2}upd(u);let p=Math.round(state.score/state.questions.length*100);content.innerHTML=`<div class="quiz-card" style="text-align:center"><div style="font-size:50px">${p>=80?'🏆':'🌱'}</div><h2>Урок завершён!</h2><p style="color:var(--muted);margin:10px 0 20px">Правильных ответов: <b>${state.score}</b> из <b>${state.questions.length}</b></p><div style="font-size:28px;font-weight:800">${p}%</div><p>Получено ⭐ ${state.score*2}</p><button class="next-btn" onclick="renderCourses()">Вернуться к разделам</button></div>`}
const dq=[['Выберите предложение с причастным оборотом.',['Ученик читает книгу.','Ученик, внимательно изучающий текст, сделал вывод.','Ученик сделал вывод.','Ученик быстро пишет.'],1,'participle'],['Выберите предложение с деепричастным оборотом.',['Девочка читает.','Девочка читала книгу.','Читая книгу, девочка делала заметки.','Девочка записала ответ.'],2,'gerund'],['Выберите СПП.',['Наступил вечер.','Мы вернулись домой, потому что начался дождь.','Наступил вечер и стало темно.','Дождь прекратился.'],1,'spp'],['Выберите правильную пунктуацию.',['Читая книгу ученик делал заметки.','Читая книгу, ученик делал заметки.','Читая, книгу ученик делал заметки.','Читая книгу ученик, делал заметки.'],1,'punctuation']];let ds={};function renderDiagnostic(){ds={i:0,s:0};dqst()}function dqst(){let q=dq[ds.i];content.innerHTML=`<div class="quiz-card"><div class="quiz-head"><span>ДИАГНОСТИКА</span><span>${ds.i+1}/${dq.length}</span></div><h2>Тест уровня знаний</h2><p style="color:var(--muted);margin:8px 0 22px">Определи темы, которые требуют практики.</p><div class="question">${q[0]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" onclick="da(${i})">${a}</button>`).join('')}</div></div>`}function da(i){if(i===dq[ds.i][2])ds.s++;if(ds.i<dq.length-1){ds.i++;dqst()}else{let u=me();u.before=Math.round(ds.s/dq.length*100);upd(u);content.innerHTML=`<div class="quiz-card" style="text-align:center"><div style="font-size:48px">📊</div><h2>Диагностика завершена</h2><div style="font-size:45px;font-weight:800;margin:15px">${u.before}%</div><p>${u.before>=80?'Отличная база!':u.before>=50?'Средний уровень.':'Начальный уровень.'}</p><button class="next-btn" onclick="renderCourses()">Перейти к обучению</button></div>`}}
function renderAnalytics(){let u=me(),m=u.mistakes,b=u.before==null?60:u.before,a=u.after==null?Math.min(100,b+20):u.after,total=Object.values(m).reduce((x,y)=>x+y,0);content.innerHTML=`<div class="section-title"><h3>📊 Аналитика обучения</h3></div><div class="stats"><div class="stat"><div class="stat-icon">📝</div><div class="stat-value">${b}%</div><div class="stat-name">До обучения</div></div><div class="stat"><div class="stat-icon">🎯</div><div class="stat-value">${a}%</div><div class="stat-name">После обучения</div></div><div class="stat"><div class="stat-icon">📈</div><div class="stat-value">+${Math.max(0,a-b)}%</div><div class="stat-name">Изменение</div></div><div class="stat"><div class="stat-icon">❌</div><div class="stat-value">${total}</div><div class="stat-name">Ошибок</div></div></div><div class="chart-card"><h3>Результат «До → После»</h3><div class="chart-row"><div class="chart-label"><span>До</span><b>${b}%</b></div><div class="bar"><div class="bar-fill before" style="width:${b}%"></div></div></div><div class="chart-row"><div class="chart-label"><span>После</span><b>${a}%</b></div><div class="bar"><div class="bar-fill after" style="width:${a}%"></div></div></div></div><div class="section-title"><h3>Ошибки по темам</h3></div><div class="chart-card">${[['Причастия',m.participle],['Деепричастия',m.gerund],['СПП',m.spp],['Пунктуация',m.punctuation]].map(x=>`<div class="chart-row"><div class="chart-label"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><div class="bar-fill before" style="width:${Math.min(100,x[1]*10)}%"></div></div></div>`).join('')}</div>`}
function renderProfile(){let u=me();content.innerHTML=`<div class="section-title"><h3>♙ Мой профиль</h3></div><div class="profile-card"><div class="big-avatar">${u.name[0].toUpperCase()}</div><h2>${u.name}</h2><p style="color:var(--muted)">${u.email}</p><div class="badges"><div class="badge">⭐ ${u.stars} звёзд</div><div class="badge">🔥 ${u.streak} дней</div><div class="badge">🏆 ${level(u.stars)}</div></div></div>`}function toggleMobile(){let s=document.querySelector('.sidebar');s.style.display=s.style.display==='block'?'none':'block'}window.addEventListener('load',()=>localStorage.getItem(S)?openApp():authPage.style.display='flex');
</script></body></html>
